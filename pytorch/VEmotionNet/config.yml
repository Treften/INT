dataset:
  train:
    server:
      data_root: /content/INT/data/OMGEmotionChallenge/omg_TrainVideos/frames
      file_list: /content/INT/data/OMGEmotionChallenge/omg_TrainVideos/train_data_with_landmarks.txt
  valid:
    server:
      data_root: /content/INT/data/OMGEmotionChallenge/omg_ValidVideos/frames
      file_list: /content/INT/data/OMGEmotionChallenge/omg_ValidVideos/valid_data_with_landmarks.txt

seed: 1234

net:
  type: ResNet
  depth: 18
  softmax_size: 2
  fine_tune: no

parser:
  max_num_clips: 0
  max_num_samples: 0

preproc:
  data_frame:
    width: 128
    height: 128
    depth: 1
  is_color: true
  mean: 127.5
  scale: 0.007843
  crop_size: 128
  aug:
    pad: 0
    color: BGR
    use_cutout: false
    use_mirroring: true
    use_random_crop: false
    use_center_crop: false
    use_random_gray: false

sampler:
  samples_is_randomize: no
  step_size_for_samples: 4

train_batcher:
  batch: 32
  queue_size: 5
  disk_reader_process_num: 1

valid_batcher:
  batch: 32
  queue_size: 5
  disk_reader_process_num: 1

batch_proc:
  use_pin_memory: yes
  use_async: yes

opt:
  type: SGD
  lr: 0.009
  momentum: 0.2
  weight_decay: 5.e-4

lr_scheduler:
  type: SGDR
  gamma: 0.01
  use_linear_decay: yes
  scale_lr: [1., 1]
  scale_lr_fc: [1., 1]

train:
  cuda_device: 0
  step_size: 100
  step_print: 100
  epoch_size: 50000
  max_iter: 10000
  validate_iter: 1000
  snapshot_iter: 10000
  experiment_name: EmoV2_step4

losses:
  CCC:
    w: 1.

ini_net:
  server: /content/INT/pytorch/VEmotionNet/EmoV2_step4/EmoV2_step4_iter_14500.model

logging:
  log_dir:
    server: /content/aver_log
  tb_log_dir:
    server: /content/aver_log
  snapshot_dir:
    server: /content/aver_log

test:
  dataset:
    data_root:
      server: /content/AFEW-VA/crop
    test_file_list:
      server: /content/AFEW-VA/crop/test_data_with_landmarks.txt
  cuda_device: 0
  file_model: /content/aver_log/EmoV2_step40/EmoV2_step40_iter_25000.model